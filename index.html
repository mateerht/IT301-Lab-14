<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT301 Lab14</title>

    <style>
        html {
            background-color: #f0f5f9;
            align-items: center;
            width: 100%;
            height: 100vh;
            font-family: 'Trebuchet MS', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            padding: 0px 0px 30px 0px;
        }

        #usrCrd {
            border: solid #8bbbd4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 100px 30px 100px;
            background-color: #c9e4f2;
            border-radius: 20px;
        }

        img {
            width: 250px;
            height: 250px;
            border: #8bbbd4 5px solid;
            border-radius: 20px;
        }

        h2,
        p {
            font-size: 20px;
            padding: 20px;
            background-color: white;
            border: solid #8bbbd4;
            border-radius: 20px;
        }

        #bttn {
            background-color: #167d8d;
            color: white;
            border: solid #115e67;
            font-size: 20px;
            font-weight: bold;
            width: 200px;
            height: 50px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1>Random User Profiles</h1>
    <div id='usrCrd'>
        <img id="img" src="" alt="User Picture">
        <h2 id="name"></h2>
        <p id="email"></p>
        <p id="phoneNum"></p>

        <button id="bttn">Generate Profile</button>
    </div>
    <script>
        const getUsr = async () => {
            try {
                let usrInfo = await fetch('https://randomuser.me/api/');
                usrInfo = await usrInfo.json();

                let user = usrInfo.results[0];

                document.getElementById('img').src = user.picture.large;
                document.getElementById('name').textContent =
                    user.name.first + ' ' + user.name.last;
                document.getElementById('email').textContent = user.email;
                document.getElementById('phoneNum').textContent = user.phone;

            } catch (reason) {
                console.log(reason);
            }
        }

        document.getElementById('bttn').addEventListener('click', getUsr);

        getUsr();
    </script>
</body>

</html>
